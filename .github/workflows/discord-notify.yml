name: CRE8 SMP Packwiz Discord changelog

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pack
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and send changelog
        uses: actions/github-script@v7
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        with:
          script: |
            const webhook = process.env.DISCORD_WEBHOOK_URL;
            if (!webhook) {
              core.setFailed("Missing DISCORD_WEBHOOK_URL repository secret in cody1025/CRE8-Pack.");
              return;
            }

            const fs = require("fs");
            const { owner, repo } = context.repo;
            const branch = context.ref.replace("refs/heads/", "");
            const before = context.payload.before;
            const after = context.sha;
            const actor = context.payload.sender?.login || context.actor;
            const repoUrl = `https://github.com/${owner}/${repo}`;
            const compareUrl = context.payload.compare || `${repoUrl}/compare/${before}...${after}`;

            let changed = [];
            if (before && !/^0+$/.test(before)) {
              const { stdout } = await exec.getExecOutput("git", ["diff", "--name-status", before, after], { silent: true });
              changed = stdout.trim().split("\n").filter(Boolean).map(line => {
                const parts = line.split("\t");
                return { status: parts[0][0], path: parts.at(-1) };
              });
            } else {
              const { stdout } = await exec.getExecOutput("git", ["ls-files"], { silent: true });
              changed = stdout.trim().split("\n").filter(Boolean).map(path => ({status:"A",path}));
            }

            const pack = fs.readFileSync("pack.toml", "utf8");
            const readValue = (key) => pack.match(new RegExp("^" + key + "\\s*=\\s*[\"']([^\"']+)[\"']", "m"))?.[1] || "unknown";
            const packName = readValue("name");
            const packVersion = readValue("version");
            const mcVersion = pack.match(/^minecraft\s*=\s*["']([^"']+)/m)?.[1] || "unknown";
            const loaderVersion = pack.match(/^neoforge\s*=\s*["']([^"']+)/m)?.[1] || "unknown";

            const modChanges = changed.filter(x => /^mods\/.*\.(jar|pw\.toml)$/i.test(x.path));
            const added = modChanges.filter(x => x.status === "A");
            const removed = modChanges.filter(x => x.status === "D");
            const updated = modChanges.filter(x => x.status !== "A" && x.status !== "D");

            const clean = (s, n=180) => String(s || "").replace(/[\r\n\u0000]/g," ").slice(0,n);
            const label = (path) => {
              const file = path.split("/").pop().replace(/\.pw\.toml$/i,"").replace(/\.jar$/i,"");
              return file.replace(/[-_]+/g," ").replace(/\b\w/g,c=>c.toUpperCase());
            };
            const link = (path) => `[${clean(label(path))}](${repoUrl}/blob/${after}/${path})`;
            const buttonLinks = [];
            const lines = [
              `## ${clean(packName)} • dev`,
              "Packwiz changelog preview.",
              "",
              `**${added.length} added · ${removed.length} removed · ${updated.length} updated**`,
              `Pushed by [${clean(actor)}](https://github.com/${actor})`,
              "",
              `${clean(packName)} ${clean(packVersion)} • minecraft ${clean(mcVersion)} • neoforge ${clean(loaderVersion)}`
            ];

            const section = (title, entries, verb) => {
              if (!entries.length) return;
              lines.push("", `**${title} (${entries.length})**`);
              for (const item of entries.slice(0, 15)) {
                const side = item.path.endsWith(".pw.toml") ? "" : "";
                lines.push(`• ${link(item.path)}${side}`);
                buttonLinks.push({ label: clean(label(item.path), 80), url: `${repoUrl}/blob/${after}/${item.path}` });
              }
              if (entries.length > 15) lines.push(`• …and ${entries.length - 15} more`);
            };

            section("Added mods", added, "Added");
            section("Removed mods", removed, "Removed");
            section("Updated mods", updated, "Updated");

            const other = changed.filter(x => !/^mods\/.*\.(jar|pw\.toml)$/i.test(x.path));
            if (other.length) {
              lines.push("", `**Other pack changes (${other.length})**`);
              for (const item of other.slice(0, 15)) {
                const verb = item.status === "A" ? "Added" : item.status === "D" ? "Removed" : "Changed";
                lines.push(`• ${verb} [${clean(item.path)}](${repoUrl}/blob/${after}/${item.path})`);
                buttonLinks.push({ label: clean(`${verb}: ${item.path.split("/").pop()}`, 80), url: `${repoUrl}/blob/${after}/${item.path}` });
              }
            }

            const commits = context.payload.commits || [];
            if (commits.length) {
              lines.push("", `**Commits (${commits.length})**`);
              for (const commit of commits.slice(-10)) {
                const sha = String(commit.id || "").slice(0,7);
                const subject = clean(commit.message?.split("\n")[0] || "Commit", 150);
                lines.push(`• [${sha}](${commit.url}) ${subject} — ${clean(commit.author?.name || actor)}`);
                buttonLinks.push({ label: `Commit ${sha}`, url: commit.url });
              }
            }

            lines.push("", `[View push](${compareUrl})`, "-# Packwiz changelog • CRE8 SMP");
            buttonLinks.unshift({ label: "View all pack changes", url: compareUrl });
            const message = lines.join("\n").slice(0, 3900);
            // Discord supports up to 25 link buttons per message (5 rows × 5 buttons).
            const buttons = buttonLinks.slice(0, 25);
            const components = [];
            for (let i = 0; i < buttons.length; i += 5) {
              components.push({
                type: 1,
                components: buttons.slice(i, i + 5).map(button => ({
                  type: 2,
                  style: 5,
                  label: button.label,
                  url: button.url
                }))
              });
            }
            // A rich embed gives the changelog a boxed/card-style layout.
            const embed = {
              title: `${clean(packName)} • Pack Update`,
              description: message,
              color: 0x00D9FF,
              footer: { text: "CRE8 SMP • Packwiz changelog" }
            };
            // Non-application webhooks must opt in to components or Discord silently ignores buttons.
            const response = await fetch(webhook + "?with_components=true&wait=true", {
              method: "POST",
              headers: {"Content-Type":"application/json"},
              body: JSON.stringify({username:"CRE8 SMP • Updates", allowed_mentions:{parse:[]}, embeds:[embed], components})
            });
            if (!response.ok) {
              core.setFailed(`Discord webhook returned HTTP ${response.status}: ${await response.text()}`);
              return;
            }
            core.info("CRE8 SMP Packwiz changelog sent successfully.");
